<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Feelings</title><!-- static so it exists before JS; keep in sync with content.pageTitle -->
    <meta name="description" content="Tell a little Chao what kind of game you want, in English or Spanish, and get a shelf of real games that fit." />
    <link rel="icon" href="data:," />
    <link rel="preload" href="/fonts/anybody-italic-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/character/chao-body.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/character/chao-eyes.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/character/chao-wing.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/character/chao-ball.svg" fetchpriority="high" />
    <script>
      // Apply the stored theme before first paint (no flash). No stored value = follow the system.
      try {
        var t = localStorage.getItem('theme'); // key must match setItem in src/main.ts
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="holo" aria-hidden="true"><canvas class="holo__canvas" hidden></canvas></div>
    <div id="app"></div>
  </body>
</html>
